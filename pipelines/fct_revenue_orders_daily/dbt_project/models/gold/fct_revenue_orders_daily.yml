# Schema và test cho pipeline fct_revenue_orders_daily. Sinh tự động từ Spec, không sửa tay.
version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: raw_payment
      - name: raw_rental

models:
  - name: stg_fct_revenue_orders_daily__payment
    columns:
      - name: payment_id
        data_tests: ['unique', 'not_null']
  - name: stg_fct_revenue_orders_daily__rental
    columns:
      - name: rental_id
        data_tests: ['unique', 'not_null']
  - name: fct_revenue_orders_daily
    columns:
      - name: payment_date
        data_tests: ['not_null']
      - name: total_revenue
        data_tests: ['not_negative']
      - name: total_orders
