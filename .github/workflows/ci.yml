name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pipeline-ci:
    name: pipeline-ci
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy bộ kiểm và scaffold từ base tin cậy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lấy commit PR để đọc object Git
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài dbt từ ràng buộc của app trên base
        run: python -m pip install -r requirements-ci.txt
      - name: Kiểm manifest và chữ ký duyệt
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python ci/check_pr.py --repo candidate --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" > "$RUNNER_TEMP/pipelines.txt"
      - name: Parse từng pipeline thay đổi
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r model; do
            python ci/parse_project.py "$model" --repo candidate --head "$PR_HEAD_SHA" --timeout 120 || exit 1
          done < "$RUNNER_TEMP/pipelines.txt"
 # CI xanh thì tự squash merge PR Deploy mở từ app, đúng commit đã qua CI.
  auto-merge:
    name: auto-merge
    needs: pipeline-ci
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pipeline/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge khi CI xanh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD_SHA" --repo "$GITHUB_REPOSITORY"
